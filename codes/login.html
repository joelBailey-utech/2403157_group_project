<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | Windward Road Primary School</title><link rel="icon" href="../assets/crest.png"><link rel="stylesheet" href="../style/style.css"><script>document.documentElement.dataset.theme=localStorage.getItem("wrps_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script></head>
<body><header id="site-header"></header>
<main><h1>Log in</h1><p id="msg" role="alert"></p>
<form id="lf"><label>Username<input name="u" required autocomplete="username"></label><label>Password<input type="password" name="p" required autocomplete="current-password"></label><button class="btn">Log in</button></form></main>
<footer id="site-footer"></footer>
<script src="../js/app.js"></script><script>$("#lf").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const u=USERS.find(x=>x.u===f.u&&x.p===f.p);if(!u)return say("Wrong username or password. Check both and try again.",1);sessionStorage.setItem("wrps_user",JSON.stringify(u));location.href=HOME[u.role]}</script>
</body></html>
