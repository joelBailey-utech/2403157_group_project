<!DOCTYPE html>
<!-- Joel Bailey | ID 2403157 | Lab: Friday 7-9 | Other group members: add names, IDs, lab times here -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrator dashboard | Windward Road Primary School</title><link rel="icon" href="../assets/crest.png"><link rel="stylesheet" href="../style/style.css"><script>document.documentElement.dataset.theme=localStorage.getItem("wrps_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script></head>
<body><header id="site-header"></header>
<main><h1>Administrator dashboard</h1><p id="msg" role="status"></p>
<div class="tabs"><button data-t="reg" class="on">Student registry</button><button data-t="mat">Academic matrix</button><button data-t="led">Financial ledger</button></div>
<section id="reg"><form id="sf"><input type="hidden" name="id"><label>Student name<input name="name" required minlength="3"></label><label>Class<select name="cls"><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option></select></label><label>Semester cohort<select name="sem"><option>Semester 1 2026</option><option>Semester 2 2026</option></select></label><label>Guardian<input name="guardian" required></label><label>Tuition (J$)<input type="number" name="tuition" min="0" value="60000" required></label><button class="btn">Save student</button></form><h2>Registered students</h2><div class="wrap"><table id="st"></table></div></section>
<section id="mat" hidden><label>Subject<select id="sub"><option>Mathematics</option><option>English Language</option><option>Science</option><option>Social Studies</option><option>Religious Education</option><option>Information Technology</option></select></label><div id="gg"></div></section>
<section id="led" hidden><form id="pf"><label>Student<select name="sid" id="ps"></select></label><label>Payment (J$)<input type="number" name="amt" min="1" required></label><button class="btn">Record payment</button></form><div class="wrap"><table id="lt"></table></div></section>
</main>
<footer id="site-footer"></footer>
<script src="../js/app.js"></script><script src="../js/admin.js"></script>
</body></html>
